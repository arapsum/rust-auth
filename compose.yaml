services:
  database:
    image: postgres:17.5-alpine
    container_name: auth-database
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"

  test-db:
    image: postgres:17.5-alpine
    container_name: auth-test-database
    restart: unless-stopped
    env_file:
      - .env.test
    ports:
      - "5433:5432"
