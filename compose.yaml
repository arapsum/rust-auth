services:
  database:
    image: postgres:17.5-alpine
    container_name: auth-database
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    networks:
      - postgresql

  mailer:
    image: mailtutan/mailtutan:latest
    container_name: mailer
    restart: unless-stopped
    ports:
      - "1080:1080"
      - "1025:1025"
    networks:
      - mailer

  test-db:
    image: postgres:17.5-alpine
    container_name: auth-test-database
    restart: unless-stopped
    env_file:
      - .env.test
    ports:
      - "5433:5432"
    networks:
      - postgresql


networks:
  postgresql:
  mailer:
