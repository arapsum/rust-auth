[package]
name = "auth"
version = "0.1.0"
edition = "2024"
authors = ["Kibet arap Sum <kibetarapsum@gmail.com>"]

[[bin]]
name = "auth"
path = "src/bin/main.rs"

[lib]
name = "auth"
path = "src/lib.rs"

[dependencies]
apalis = { version = "0.7.4", features = ["retry"] }
apalis-redis = "0.7.4"
argon2 = "0.5.3"
async-trait = "0.1.89"
axum = { version = "0.8.8", features = ["json", "macros"] }
axum-extra = { version = "0.12.5", features = ["cookie", "typed-header", "typed-routing"] }
axum-test = { version = "19.1.1", features = ["typed-routing"] }
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.5.60", features = ["derive"] }
color-eyre = "0.6.5"
dotenvy = "0.15.7"
futures-util = "0.3.32"
handlebars = { version = "6.4.0", features = ["dir_source"] }
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto", "use_pem"] }
lettre = { version = "0.11.19", features = ["tokio1", "tracing", "tokio1-native-tls"] }
redis = "1.1.0"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde-saphyr = "0.0.21"
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["chrono", "postgres", "runtime-tokio", "tls-native-tls", "uuid"] }
tera = { version = "1.20.1", default-features = false }
thiserror = "2.0.18"
time = { version = "0.3.47", features = ["local-offset"] }
tokio = { version = "1.50.0", features = ["full"] }
tower = { version = "0.5.3", features = ["tracing", "tokio"] }
tower-http = { version = "0.6.8", features = ["trace", "cors"] }
tracing = { version = "0.1.44", features = ["log"] }
tracing-appender = "0.2.4"
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json", "serde", "tracing"] }
uuid = { version = "1.22.0", features = ["v4", "serde"] }
validator = { version = "0.20.0", features = ["derive"] }

[dev-dependencies]
axum-test = { version = "19.1.1", features = ["typed-routing"] }
insta = { version = "1.46.3", features = ["redactions", "filters"] }
rstest = "0.26.1"
serial = "0.4.0"
serial_test = "3.4.0"
